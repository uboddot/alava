services:
  frontend:
    build:
      context: ./alavaFrontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    develop:
      watch:
        # Source + config: copied into the running container, Vite HMR / restart picks it up
        - action: sync
          path: ./alavaFrontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - package.json
            - package-lock.json
        # Dependency changes: rebuild the image (runs npm ci) and recreate the container
        - action: rebuild
          path: ./alavaFrontend/package.json
        - action: rebuild
          path: ./alavaFrontend/package-lock.json
