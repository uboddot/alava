name: build and push frontend image

on:
  push:
    branches: [main, dev, ciSetup]
    paths:
      - "alavaFrontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main, dev]

# serialize runs so two pushes never compute the same version tag
concurrency:
  group: frontend-version
  cancel-in-progress: false

jobs:
  build-and-push-frontend-image:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # push to main bumps the major (vX.0), push to dev bumps the minor (vX.Y); everything else is devX.X
      - name: Compute version
        id: version
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0}
          major=${latest#v}; major=${major%%.*}
          minor=${latest##*.}
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            version="v$((major + 1)).0"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = dev ]; then
            version="v${major}.$((minor + 1))"
          else
            version="devX.X"
          fi
          echo "Latest tag: $latest -> version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # PR runs only build (as a check); images are pushed only for real pushes so PRs never overwrite :latest
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f ./alavaFrontend/Dockerfile --build-arg VITE_APP_VERSION=${{ steps.version.outputs.version }} -t ghcr.io/${{ github.repository_owner }}/frontend_alava:latest -t ghcr.io/${{ github.repository_owner }}/frontend_alava:${{ github.sha }} ./alavaFrontend

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/frontend_alava:latest
          docker push ghcr.io/${{ github.repository_owner }}/frontend_alava:${{ github.sha }}

      - name: Push versioned image and git tag
        if: steps.version.outputs.version != 'devX.X'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/frontend_alava:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/frontend_alava:$VERSION
          docker push ghcr.io/${{ github.repository_owner }}/frontend_alava:$VERSION
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
