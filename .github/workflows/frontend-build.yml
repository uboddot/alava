name: build and push frontend image

on:
  push:
    branches: [main, dev, ciSetup]
    paths:
      - "alavaFrontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main, dev]

jobs:
  build-and-push-frontend-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f ./alavaFrontend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/frontend_alava:latest -t ghcr.io/${{ github.repository_owner }}/frontend_alava:${{ github.sha }} ./alavaFrontend

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/frontend_alava:latest
          docker push ghcr.io/${{ github.repository_owner }}/frontend_alava:${{ github.sha }}
